<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 100" fill="none">
  <defs>
    <filter id="te-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- TotalEnergies Multi-Color Ribbon Emblem -->
  <g transform="translate(10, 14)" filter="url(#te-shadow)">
    <!-- Red band -->
    <path d="M 12 36 C 12 20 25 10 40 10 C 50 10 58 15 64 22 C 58 18 50 14 40 14 C 28 14 18 24 18 36 C 18 48 28 58 40 58 C 50 58 58 54 64 50 C 58 57 50 62 40 62 C 25 62 12 52 12 36 Z" fill="#ED1C24" />
    <!-- Orange band -->
    <path d="M 24 36 C 24 26 31 18 40 18 C 47 18 53 22 57 28 C 53 24 47 22 40 22 C 32 22 28 28 28 36 C 28 44 32 50 40 50 C 47 50 53 48 57 44 C 53 50 47 54 40 54 C 31 54 24 46 24 36 Z" fill="#FF7900" />
    <!-- Yellow / Gold band -->
    <circle cx="40" cy="36" r="6" fill="#FFC20E" />
    <!-- Green curve -->
    <path d="M 40 10 C 55 10 68 22 68 36 C 68 44 64 52 57 58 C 62 52 64 44 64 36 C 64 24 54 14 40 14 Z" fill="#00A352" />
    <!-- Cyan / Light Blue curve -->
    <path d="M 40 6 C 58 6 72 20 72 36 C 72 46 68 56 60 62 C 66 56 70 46 70 36 C 70 22 56 10 40 10 Z" fill="#009EE0" />
    <!-- Deep Blue bottom curve -->
    <path d="M 40 62 C 30 62 20 56 16 48 C 18 54 28 66 40 66 C 54 66 66 56 70 44 C 66 54 54 62 40 62 Z" fill="#0055A5" />
  </g>

  <!-- Typography: TotalEnergies -->
  <g transform="translate(94, 22)">
    <!-- Total (Bold) -->
    <text x="0" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="31" font-weight="900" fill="#ED1C24" letter-spacing="-0.5">Total</text>
    <!-- Energies (Clean rounded modern) -->
    <text x="76" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="31" font-weight="400" fill="#ED1C24" letter-spacing="-0.3">Energies</text>
  </g>

  <!-- Subtext: MARKETING GABON -->
  <text x="96" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="800" letter-spacing="2.2" fill="#0055A5">MARKETING GABON</text>
</svg>

