<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 100" fill="none">
  <defs>
    <linearGradient id="ola-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00529B" />
      <stop offset="100%" stop-color="#0072CE" />
    </linearGradient>
    <linearGradient id="ola-orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A00" />
      <stop offset="100%" stop-color="#FF7A00" />
    </linearGradient>
    <filter id="ola-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- OLA Swirl Icon -->
  <g transform="translate(10, 10)">
    <!-- Blue outer sweep -->
    <path d="M 40 4 C 18 4 2 22 2 44 C 2 64 16 78 36 78 C 30 72 26 62 26 50 C 26 34 38 20 54 18 C 66 16 72 22 74 28 C 76 20 62 4 40 4 Z" fill="url(#ola-blue-grad)" filter="url(#ola-shadow)" />
    <!-- Orange inner flame swirl -->
    <path d="M 42 16 C 52 16 62 24 64 36 C 66 48 56 62 42 66 C 30 70 20 62 18 52 C 22 60 30 64 38 62 C 48 60 54 50 52 40 C 50 30 42 24 34 24 C 26 24 22 28 20 32 C 22 22 30 16 42 16 Z" fill="url(#ola-orange-grad)" filter="url(#ola-shadow)" />
  </g>

  <!-- Typography: OLA -->
  <g transform="translate(105, 12)">
    <!-- O -->
    <path d="M 32 4 C 14.3 4 0 18.3 0 36 C 0 53.7 14.3 68 32 68 C 49.7 68 64 53.7 64 36 C 64 18.3 49.7 4 32 4 Z M 32 18 C 42 18 50 26 50 36 C 50 46 42 54 32 54 C 22 54 14 46 14 36 C 14 26 22 18 32 18 Z" fill="#00529B" />
    
    <!-- L -->
    <path d="M 74 6 H 88 V 54 H 116 V 66 H 74 Z" fill="#00529B" />

    <!-- A -->
    <path d="M 144 6 L 122 66 H 136 L 141 52 H 163 L 168 66 H 182 L 160 6 H 144 Z M 152 21 L 159 40 H 145 Z" fill="#00529B" />
  </g>

  <!-- Subtext: ENERGY GABON -->
  <text x="106" y="88" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="3" fill="#FF5A00">ENERGY</text>
  <text x="180" y="88" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#64748B">GABON</text>
</svg>

